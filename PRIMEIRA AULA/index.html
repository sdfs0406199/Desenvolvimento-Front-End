<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PRIMEIRA AULA</title>
</head>

<body>
    <p>Minha pagina fala sobre Linguagem de marcação</p>
    <!-- 'strong' deixa a letra em negrito -->
     <!-- 'em' deixa a letra em italico -->
    <p>essa aula é de <em><strong>HTML</strong></em></p>
    <H1>Titulo 1</H1>
    <H2>Titulo 2</H2>
    <H3>Titulo 3</H3>
    <H4>Titulo 4</H4>
    <H5>Titulo 5</H5>
    <H6>Titulo 6</H6>
    <!-- 'br' faz a quebra de linha -->
    <p>a tag br quebra <br> a <br>linha</p>
    <a href="https://th.bing.com/th/id/OIP.nyj798ymEzuS4zk24crjOAHaEK?w=288&h=180&c=7&r=0&o=7&pid=1.7&rm=3">tome teu
        link fela da pota</a>
        <!-- 'OL' CRIA LISTA ORDENADA -->
        <ol>
            <li>item 1</li>
            <li>item 2</li>
        </ol>
        <!-- 'UL' CRIA LISTA NAO ORDENADA -->
        <ul>
            <li>item<strong> 3 </strong></li>
            <li>item 4</li>
        </ul>
        <img src="OIP.jpg" alt="Gengar Dinamax Shiny" width="100" height="100">
</body>

</html>
