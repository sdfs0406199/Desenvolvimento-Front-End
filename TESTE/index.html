<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .card{
        width: 200px;
        height: 150px;
        border-bottom: 2px solid orange;
        border-radius: 25px;
    }
    .mae{
        width: 400px;
        height: 200px;
        border: 2px solid red;
        margin: auto;
        display: flex;
        justify-content: space-around;
        align-items: center;
    }
    .filha{
        width: 100px;
        height: 100px;
        border: 1px solid blue;
    }
</style>
<body>
    <div class="card">
    </div>
    <div class="mae">
        <div class="filha">
        </div>
        <div class="filha">
        </div>
        <div class="filha">
        </div>
    </div>

</body>
</html>
